# Leva o site (pasta site/, enviada por scripts/site-github.mjs do projeto) ao GitHub Pages,
# servido em scispectrum.dpdns.org. Só roda quando site/ muda.
name: Publicar site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publicar
        uses: actions/deploy-pages@v4
