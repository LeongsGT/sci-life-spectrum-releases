# Publica uma versão do Sci Life Spectrum.
# O instalador chega em partes (< 100 MB cada, limite do Git) num branch upload/vX.Y.Z;
# este workflow junta as partes, confere o SHA-512, cria a Release e apaga o branch.
# Com incoming/PRERELEASE: sai como pré-lançamento (teste; ninguém recebe pela atualização automática).
# Branch promote/vX.Y.Z (vazio): promove esse pré-lançamento a versão oficial (a "latest").
name: Publicar versão

on:
  push:
    branches: ['upload/**', 'promote/**']

permissions:
  contents: write

jobs:
  promote:
    if: startsWith(github.ref_name, 'promote/')
    runs-on: ubuntu-latest
    steps:
      - name: Promover a oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#promote/}"
          for i in 1 2 3 4 5; do
            gh release edit "${V}" --repo "${{ github.repository }}" --prerelease=false --draft=false --latest && break
            sleep 20
          done
          [ "$(gh release view "${V}" --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)" = "false" ]
      - uses: actions/checkout@v4
      - name: Apagar branch
        if: always()
        run: git push origin --delete "${GITHUB_REF_NAME}" || true

  publish:
    if: startsWith(github.ref_name, 'upload/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Juntar partes e conferir integridade
        id: build
        run: |
          set -euo pipefail
          cd incoming
          VERSION="$(cat VERSION)"
          EXE="SciLifeSpectrum-Setup-${VERSION}.exe"
          cat parts/${EXE}.part-* > "${EXE}"
          EXPECTED="$(grep -m1 '^sha512:' latest.yml | awk '{print $2}')"
          ACTUAL="$(openssl dgst -sha512 -binary "${EXE}" | base64 -w0)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then echo "SHA-512 não confere"; exit 1; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "exe=${EXE}" >> "$GITHUB_OUTPUT"

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd incoming
          V="${{ steps.build.outputs.version }}"
          NOTES="Instalador do Sci Life Spectrum ${V} para Windows."
          [ -f NOTES.md ] && NOTES="$(cat NOTES.md)"
          R="--repo ${{ github.repository }}"
          FILES=("${{ steps.build.outputs.exe }}" "${{ steps.build.outputs.exe }}.blockmap" latest.yml)
          [ -f SciLife-Android.apk ] && FILES+=(SciLife-Android.apk)   # App Android (opcional)
          if ls native/*.zip.part-* >/dev/null 2>&1; then                # Prévia do app nativo (opcional)
            ZIP="$(ls native/*.zip.part-* | sed -n '1s/\.part-[0-9]*$//p')"
            cat "${ZIP}".part-* > "${ZIP}"
            FILES+=("${ZIP}")
            [ -f native/native.yml ] && FILES+=(native/native.yml)   # manifesto da atualização do app nativo
          fi
          # 1. Rascunho com os arquivos. Se uma tentativa anterior deixou rascunho, reaproveita (reenvia por cima).
          STATE="$(gh release view "v${V}" $R --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$STATE" = "none" ]; then
            gh release create "v${V}" "${FILES[@]}" $R --draft --title "Sci Life Spectrum ${V}" --notes "${NOTES}" || true
          fi
          # O GitHub às vezes devolve HTTP 500 no envio mesmo gravando o arquivo: confere e reenvia o que faltar
          for f in "${FILES[@]}"; do
            n="$(basename "$f")"
            ok="$(gh release view "v${V}" $R --json assets --jq ".assets[] | select(.name==\"$n\") | .size" 2>/dev/null || true)"
            # .yml sempre vai de novo: um manifesto novo pode ter o mesmo tamanho do antigo
            if [ "$ok" != "$(stat -c %s "$f")" ] || [[ "$n" == *.yml ]]; then
              for i in 1 2 3; do gh release upload "v${V}" "$f" $R --clobber && break; sleep 15; done
            fi
          done
          # 2. Publica (cria a tag). Erros 500 ao gravar refs acontecem: tenta algumas vezes.
          KIND="--latest"
          [ -f PRERELEASE ] && KIND="--prerelease --latest=false"
          for i in 1 2 3 4 5 6 7 8; do
            gh release edit "v${V}" $R --draft=false $KIND --title "Sci Life Spectrum ${V}" --notes "${NOTES}" && break
            sleep 30
          done
          [ "$(gh release view "v${V}" $R --json isDraft --jq .isDraft)" = "false" ]

      - name: Apagar branch de upload
        if: always()
        run: git push origin --delete "${GITHUB_REF_NAME}" || true
